name: Build Lean 25 x86-64 PassWall samba4

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'files/**'
      - 'package/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build-lede.yml'

concurrency:
  group: build-lede-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        timeout-minutes: 5
        run: |
          echo "init start $(date -Is)"
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir
          timeout 90 sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          echo "init done $(date -Is)"
          free -h
          df -hT

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        timeout-minutes: 15
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        timeout-minutes: 40
        run: |
          cd openwrt
          echo "defconfig $(date -Is)"
          make defconfig
          chmod +x $GITHUB_WORKSPACE/scripts/after-defconfig.sh $GITHUB_WORKSPACE/scripts/audit-config.sh
          echo "after-defconfig $(date -Is)"
          $GITHUB_WORKSPACE/scripts/after-defconfig.sh
          $GITHUB_WORKSPACE/scripts/audit-config.sh
          grep -E 'CONFIG_PACKAGE_(luci-nginx|uhttpd|samba4|luci-app-samba4|luci-app-passwall|luci-app-mosdns|librespeed-go|luci-app-istorex|luci-app-quickstart|luci-app-fastnet|luci-app-diskman|luci-i18n-diskman|luci-app-filemanager|luci-app-mwan3|mwan3|parted|blkid|block-mount|e2fsprogs|kmod-ixgbe|smartmontools|mdadm|iptables|firewall4|nftables-json)|CONFIG_(VMDK_IMAGES|CCACHE)' .config || true
          rm -rf dl/go-mod-cache tmp/go-build
          echo "make download $(date -Is)"
          timeout 25m make download -j8 || timeout 10m make download -j1
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          echo "download done $(date -Is)"

      - name: Compile the firmware
        id: compile
        run: |
          # VMDK conversion needs qemu-img; missing it aborts target/linux after the img is already built.
          if ! command -v qemu-img >/dev/null 2>&1; then
            timeout 90 sudo apt-get update -qq
            timeout 90 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-utils
          fi
          qemu-img --version
          cd openwrt
          rm -rf dl/go-mod-cache tmp/go-build
          echo -e "$(nproc) thread compile"
          echo "build host Go first (sbwml branch chosen in diy-part2.sh)"
          if ! make -j1 package/feeds/packages/golang/host/compile; then
            echo "host golang failed to compile"
            exit 1
          fi
          if [ -x staging_dir/hostpkg/bin/go ]; then
            staging_dir/hostpkg/bin/go version
          elif [ -x staging_dir/host/bin/go ]; then
            staging_dir/host/bin/go version
          fi
          dump_fail_logs() {
            echo "===== df ====="
            df -hT || true
            echo "===== qemu-img ====="
            command -v qemu-img || echo "qemu-img missing"
            echo "===== collected errors ====="
            grep -R "ERROR:\|Error 1\|requires go\|Cannot satisfy\|Collected errors\|No space\|is installed by\|File clash" logs tmp 2>/dev/null | tail -n 160 || true
            echo "===== package/install V=s (last 250 lines) ====="
            make package/install -j1 V=s 2>&1 | tail -n 250 || true
            failpkg=$(grep -R "ERROR: package/.* failed to build" logs 2>/dev/null | tail -n 1 | sed -n 's/.*ERROR: package\/\(.*\) failed to build.*/\1/p' || true)
            [ -z "$failpkg" ] && failpkg=wireshark
            echo "===== ${failpkg} CMake logs ====="
            find build_dir -path "*${failpkg}*" \( -name CMakeError.log -o -name CMakeOutput.log -o -name CMakeCache.txt \) 2>/dev/null | while read -r f; do
              echo "----- $f (tail) -----"
              tail -n 150 "$f" || true
            done
            echo "===== ${failpkg} compile -j1 V=s after clean ====="
            make "package/${failpkg}/clean" || true
            make "package/${failpkg}/compile" -j1 V=s 2>&1 | tail -n 400 || true
            echo "===== ${failpkg} CMake logs after V=s ====="
            find build_dir -path "*${failpkg}*" \( -name CMakeError.log -o -name CMakeOutput.log \) 2>/dev/null | while read -r f; do
              echo "----- $f -----"
              cat "$f" || true
            done
          }
          if ! make -j"$(nproc)"; then
            echo "parallel make failed, retry -j1"
            if ! make -j1; then
              dump_fail_logs
              exit 1
            fi
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Organize files
        id: organize
        if: success() && env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt
          dest=$(echo bin/targets/*/*)
          cd "$dest"
          mf=$(ls -1 *.manifest 2>/dev/null | head -1 || true)
          if [ -z "$mf" ]; then
            echo "missing image manifest"
            ls -la
            exit 1
          fi
          echo "==== image manifest (diskman / ixgbe / data partition tools) ===="
          grep -E 'luci-app-diskman|luci-i18n-diskman|parted|blkid|block-mount|e2fsprogs|kmod-ixgbe' "$mf" || true
          for need in luci-app-diskman parted blkid block-mount e2fsprogs kmod-ixgbe smartmontools; do
            if ! grep -E "^${need}([[:space:]]|-)" "$mf"; then
              echo "IMAGE FAIL: ${need} not in $mf"
              cat "$mf"
              exit 1
            fi
          done
          rm -rf packages
          find . -type f ! -name '*ext4-combined-efi.img' ! -name '*ext4-combined-efi.img.gz' ! -name '*ext4-combined-efi.vmdk' ! -name '*ext4-combined-efi.vmdk.gz' ! -name 'sha256sums' -delete
          rev=$(sed -n "s/.*DISTRIB_REVISION='\([^']*\)'.*/\1/p" /workdir/openwrt/package/lean/default-settings/files/zzz-default-settings | head -1)
          [ -n "$rev" ] || rev=25
          day=$(date +%Y%m%d)
          img=$(ls -1 *ext4-combined-efi.img *ext4-combined-efi.img.gz 2>/dev/null | head -1 || true)
          vmdk=$(ls -1 *ext4-combined-efi.vmdk *ext4-combined-efi.vmdk.gz 2>/dev/null | head -1 || true)
          [ -n "$img" ] && mv -v "$img" "lede-${rev}-${day}.img${img##*.img}"
          [ -n "$vmdk" ] && mv -v "$vmdk" "lede-${rev}-${day}.vmdk${vmdk##*.vmdk}"
          # GitHub Releases reject single assets >= 2 GiB; gzip raw images for release.
          if [ -f "lede-${rev}-${day}.img" ]; then
            echo "gzip release image (GitHub 2GiB asset limit)"
            gzip -9 "lede-${rev}-${day}.img"
          fi
          rm -f sha256sums
          sha256sum lede-${rev}-${day}.* > "sha256sums-lede-${rev}-${day}.txt"
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          ls -lh

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: LEDE25_passwall_samba${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 90

      - name: Generate release tag
        id: tag
        if: success() && env.UPLOAD_RELEASE == 'true'
        run: |
          # New unique tag every run. Never delete or reuse a previous GitHub Release.
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")-run${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT
          {
            echo "## Lean LEDE 25 x86-64"
            echo
            echo "- Source: coolsnowwolf/lede master"
            echo "- Web: luci-nginx HTTPS (no uhttpd), Argon, default LuCI overview"
            echo "- LAN: 192.168.9.1/24, ext4 root 2048M + leftover /data, EFI img.gz + VMDK"
            echo "- IMG 超过 GitHub 2GiB 限制时已 gzip；解压: \`gunzip -k lede-*.img.gz\`"
            echo "- Proxy: PassWall nft + mosdns (yaml, no DNS leak to Aliyun)"
            echo "- WAN: mwan3 nftables port (no iptables)"
            echo "- Share: samba4; diskman + official filemanager; ttyd; ddns-go"
            echo "- NIC: kmod-ixgbe (Intel 82599ES / X520 SFP+)"
            echo "- 本页是新增的一份固件。以前的 Releases **不会删除、不会覆盖**，请在仓库 Releases 列表里往下翻。"
          } > release.txt
          echo "status=success" >> $GITHUB_OUTPUT
          echo "existing releases (kept):"
          gh release list --limit 30 || true

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: success() && steps.tag.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          # Organize keeps uncompressed .vmdk for VM import; only .img is gzip'd.
          # Do not list *.vmdk.gz — fail_on_unmatched_files would abort the release.
          files: |
            ${{ env.FIRMWARE }}/*.img.gz
            ${{ env.FIRMWARE }}/*.vmdk
            ${{ env.FIRMWARE }}/sha256sums*.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

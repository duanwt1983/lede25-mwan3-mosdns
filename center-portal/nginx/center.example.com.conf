server {
    listen 18443 ssl;
    server_name center.example.com;
    ssl_certificate /etc/nginx/ssl/center.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/center.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /authelia/ {
        proxy_pass http://127.0.0.1:9091/authelia/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = / {
        access_by_lua_block {
            local id = ngx.var.cookie_center_gw
            if id and id ~= "" then
                return ngx.redirect("/home/gw/" .. id .. "/cgi-bin/luci/")
            end
            local host = ngx.var.http_host or ngx.var.host
            return ngx.redirect("https://" .. host .. "/authelia/?rd=" .. ngx.escape_uri("https://" .. host .. "/home/"))
        }
    }

    location = /home/sites.json {
        access_by_lua_file /etc/nginx/lua/center-portal-auth.lua;
        proxy_pass http://127.0.0.1:8765/sites;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store";
    }

    location /home/api/admin/ {
        access_by_lua_file /etc/nginx/lua/center-portal-auth.lua;
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /home/api/account/ {
        access_by_lua_file /etc/nginx/lua/center-portal-auth.lua;
        proxy_pass http://127.0.0.1:8765/account/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /home/api/ {
        access_by_lua_file /etc/nginx/lua/center-portal-auth.lua;
        alias /var/www/center-portal/api/;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # 区域中心根 CA（公网可下载，供网关 frpc 强制 TLS 校验）
    location = /home/ca/root-ca.crt {
        alias /var/www/center-portal/ca/root-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="lede-center-root-ca.crt"';
        add_header Cache-Control "public, max-age=86400";
    }

    include /www/server/panel/vhost/nginx/center-portal-gw.inc;

    location /home/ {
        access_by_lua_file /etc/nginx/lua/center-portal-auth.lua;
        alias /var/www/center-portal/;
        index index.html;
    }
}

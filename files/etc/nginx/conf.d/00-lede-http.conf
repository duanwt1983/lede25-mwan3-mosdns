# Keep normal LuCI /ubus requests in memory. The /ubus location additionally
# rejects bodies above 64 KiB. Firmware also patches nginx-ubus-module to reject
# temp-file buffers (NULL in-memory position) instead of segfaulting.
client_body_buffer_size 128k;

# Do not log request bodies or credentials. Record only the source, request
# metadata and whether the JSON-RPC body looks like a session login call.
map $request_body $lede_remote_login {
	default 0;
	~*\"session\"[[:space:]]*,[[:space:]]*\"login\" 1;
}
log_format lede_remote '$remote_addr|$request_method|$uri|$status|$lede_remote_login';
